port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  udp_port: 7882
  # Rootless authority domains cannot route LiveKit's private container address.
  # Advertise the host's externally reachable address to cross-domain clients.
  use_external_ip: true

room:
  auto_create: false

keys:
  "{{LIVEKIT_API_KEY}}": "{{LIVEKIT_API_SECRET}}"
